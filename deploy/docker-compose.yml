# Produção na VPS (Fase 9 mínima, ADR-0009). Não use para desenvolvimento (para isso, o docker-compose.yml da raiz).
# Rode sempre a partir desta pasta, com o arquivo ".env" ao lado (copie o ".env.example"):
#   docker compose up -d --build --wait
#
# Só o "proxy" publica porta (443). O banco e a API ficam em redes internas e NUNCA têm porta aberta para
# a internet (§11). Para entrar no banco, use "docker compose exec postgres psql ...".
name: corona-producao

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_prepared_transactions=0 # ADR-0002: transações preparadas segurariam o xmin do pull
      - -c
      - timezone=UTC # ADR-0002: datas sempre em UTC
      - -c
      - log_timezone=UTC
      - -c
      - shared_buffers=512MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Preencha POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${DB_NAME:?Preencha DB_NAME no arquivo .env}
      DB_MIGRACAO_USER: ${DB_MIGRACAO_USER:?Preencha DB_MIGRACAO_USER no arquivo .env}
      DB_MIGRACAO_PASSWORD: ${DB_MIGRACAO_PASSWORD:?Preencha DB_MIGRACAO_PASSWORD no arquivo .env}
      DB_APP_USER: ${DB_APP_USER:?Preencha DB_APP_USER no arquivo .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Preencha DB_APP_PASSWORD no arquivo .env}
    # SEM "ports": o banco só existe dentro da rede "banco".
    networks: [banco]
    volumes:
      - corona_pg:/var/lib/postgresql
      - ../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: &log
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  api:
    build:
      context: ../backend
    image: corona-api:producao
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME}
      DB_MIGRACAO_USER: ${DB_MIGRACAO_USER}
      DB_MIGRACAO_PASSWORD: ${DB_MIGRACAO_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      JWT_CHAVE_ATUAL_ID: ${JWT_CHAVE_ATUAL_ID:?Preencha JWT_CHAVE_ATUAL_ID no arquivo .env}
      JWT_CHAVE_ATUAL: ${JWT_CHAVE_ATUAL:?Preencha JWT_CHAVE_ATUAL no arquivo .env}
      JWT_CHAVE_ANTERIOR_ID: ${JWT_CHAVE_ANTERIOR_ID:-}
      JWT_CHAVE_ANTERIOR: ${JWT_CHAVE_ANTERIOR:-}
      SESSAO_SEGREDO_RENOVACAO: ${SESSAO_SEGREDO_RENOVACAO:?Preencha SESSAO_SEGREDO_RENOVACAO no arquivo .env}
      # A rede "web" tem endereço fixo: só o proxy dela pode informar o IP real de quem tenta entrar.
      CORONA_PROXIES_CONFIAVEIS: 172.30.0.0/24
      ADMIN_NOME: ${ADMIN_NOME:-}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      APP_VERSAO_MINIMA_GESTAO: ${APP_VERSAO_MINIMA_GESTAO:-1.0.0}
      APP_VERSAO_MINIMA_VENDAS: ${APP_VERSAO_MINIMA_VENDAS:-1.0.0}
      ARQUIVOS_PASTA: /dados/arquivos
    # "banco": fala com o PostgreSQL. "web": o proxy chega nela e ela sai para a internet (cotações do Banco Central).
    networks: [banco, web]
    volumes:
      - ${CORONA_PASTA_ARQUIVOS:-/srv/corona/arquivos}:/dados/arquivos
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8080/actuator/health | grep -q UP']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    logging: *log

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${PORTA_HTTPS:-443}:443'
    networks:
      web:
        ipv4_address: 172.30.0.10
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/corona-proxy.conf:/etc/nginx/corona-proxy.conf:ro
      - ${CORONA_PASTA_CERTIFICADO:-/etc/corona/tls}:/etc/corona/tls:ro
      - ${CORONA_PASTA_ATUALIZACOES:-/srv/corona/atualizacoes}:/srv/atualizacoes:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Configuração válida e processo vivo (o alpine não tem curl; o wget dele não fala HTTPS).
      test: ['CMD-SHELL', 'nginx -t >/dev/null 2>&1 && kill -0 $$(cat /tmp/nginx.pid)']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *log

networks:
  # Só o banco e a API. "internal" = sem saída para a internet e sem entrada.
  banco:
    internal: true
  web:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  corona_pg:

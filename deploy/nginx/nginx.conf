# Proxy HTTPS da produção (ADR-0009). Certificado autoassinado, fixado no Corona Gestão.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;
  client_body_temp_path /tmp/corpo;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Limite só no login: 10 por minuto por endereço (a API também trava; este é o primeiro portão).
  limit_req_zone $binary_remote_addr zone=login:2m rate=10r/m;

  # Quem não pede pelo caminho certo não leva nada (nem Swagger, nem páginas de erro com marca).
  server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/corona/tls/servidor.crt;
    ssl_certificate_key /etc/corona/tls/servidor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1h;
    ssl_session_cache shared:SSL:5m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 110m;

    # Saúde: sem detalhes (a API só devolve UP ou DOWN).
    location = /actuator/health {
      proxy_pass http://api:8080;
      include /etc/nginx/corona-proxy.conf;
    }

    location = /api/auth/login {
      limit_req zone=login burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://api:8080;
      include /etc/nginx/corona-proxy.conf;
    }

    location /api/ {
      proxy_pass http://api:8080;
      include /etc/nginx/corona-proxy.conf;
    }

    # Atualizações do Corona Gestão: arquivos prontos, só leitura, sem listar a pasta.
    location /atualizacoes/ {
      alias /srv/atualizacoes/;
      autoindex off;
      limit_except GET HEAD { deny all; }
      add_header Cache-Control "no-cache" always;
    }

    location / { return 404; }
  }
}

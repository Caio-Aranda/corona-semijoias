name: CI

# Regra da casa (especificação §14): não se faz merge com CI vermelho. Para gastar poucos minutos do GitHub Actions
# sem enfraquecer nenhuma verificação (ver docs/ci.md): PR em rascunho não roda; push novo cancela o run antigo do PR;
# cada job só roda quando o PR mexe no que ele confere; o job "ci" (o da regra de merge) sempre reporta no fim.
# A main não roda o CI a cada merge (o PR já passou): há uma rodada completa agendada toda segunda e uma sob demanda.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Push novo no PR cancela o run antigo; o run agendado e o manual nunca se cancelam entre si.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide, pelos arquivos que o PR muda, quais jobs pesados rodam. Fora de PR (agendado e manual), roda tudo.
  mudancas:
    name: mudancas
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      frontend: ${{ steps.arquivos.outputs.frontend }}
      backend: ${{ steps.arquivos.outputs.backend }}
      migracoes: ${{ steps.arquivos.outputs.migracoes }}
      dependencias: ${{ steps.arquivos.outputs.dependencias }}
      docs: ${{ steps.arquivos.outputs.docs }}
      sync: ${{ steps.arquivos.outputs.sync }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: arquivos
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for k in frontend backend dependencias docs sync; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            echo "migracoes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mudou="$(git diff --name-only "$BASE" HEAD)"
          echo "$mudou"
          tem() { echo "$mudou" | grep -Eq "$1" && echo true || echo false; }
          {
            # O front confere apps, packages, scripts e a configuração da raiz (e o próprio workflow).
            echo "frontend=$(tem '^(apps/|packages/|scripts/|testes-e2e/|testes-sync/|package(-lock)?\.json$|eslint\.config\.mjs$|tsconfig\.base\.json$|\.nvmrc$|\.prettier|\.github/)')"
            # O backend roda com PostgreSQL de verdade; também quando o contrato OpenAPI versionado muda e quando muda o
            # glossário (o GlossarioDasMensagensTest lê docs/glossario-interface.md).
            echo "backend=$(tem '^(backend/|infra/|packages/api-client-[a-z]+/openapi\.json$|docs/glossario-interface\.md$|\.github/)')"
            echo "migracoes=$(tem '^backend/src/main/resources/db/migration/')"
            echo "dependencias=$(tem '(^|/)package(-lock)?\.json$|^backend/pom\.xml$|^\.github/')"
            # Duas pontas (tarefa 5.12): só quando muda o que o sync usa de fato. Os pacotes do backend e o risco aceito
            # (um serviço de fora desta lista mudar sem rodar as duas pontas) estão em docs/ci.md.
            echo "sync=$(tem '^(testes-sync/|apps/seller-app/src/(main|shared)/|apps/seller-app/package\.json$|packages/(api-client-vendedor|conexao-segura)/|package-lock\.json$|infra/|\.github/|backend/pom\.xml$|backend/src/main/resources/(application\.properties$|db/migration/)|backend/src/main/java/br/com/coronasemijoias/api/(sync|vendas|devolucoes|trocas|creditos|remessas|vendedor|cadastros|autenticacao|sessoes|aparelhos|aplicativo|estoque|produtos|fotos)/)')"
            # Só documentos: roda apenas a conferência de formatação (job "docs").
            echo "docs=$(tem '^docs/|\.md$')"
          } >> "$GITHUB_OUTPUT"

  frontend:
    name: frontend
    needs: mudancas
    if: needs.mudancas.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Cliente gerado em dia com o OpenAPI versionado (o backend confere o OpenAPI com a API, no job backend).
      - run: npm run api:clientes -- --so-gerar
      - name: Código gerado não pode divergir
        run: |
          if [ -n "$(git status --porcelain -- packages/api-client-dona packages/api-client-vendedor)" ]; then
            git status --short -- packages/api-client-dona packages/api-client-vendedor
            echo "::error::O código gerado dos clientes está desatualizado. Rode npm run api:clientes e inclua o resultado no commit."
            exit 1
          fi
      - run: npm run lint
      # Peças puras da publicação do Corona Gestão (versão, latest.yml, nomes).
      - run: npm run scripts:test
      - run: npm run typecheck
      - run: npm run format:check
      # Tarefas 14 a 16 só acrescentam os scripts "test" e "build" nos workspaces.
      - run: npm test --workspaces --if-present
      - run: npm run build --workspaces --if-present
      # Barreira do ADR-0003, camada 2: empacota o Corona Vendas de verdade (electron-builder --dir, com o
      # Electron que o npm já baixou: nada novo é baixado) e varre o app.asar atrás dos marcadores proibidos
      # (scripts/marcadores-proibidos.json). A camada 3 varre packages/shared, packages/ui e packages/conexao-segura.
      - name: Barreira do pacote (Corona Vendas)
        run: |
          test -d node_modules/electron/dist || node node_modules/electron/install.js
          npm run seller:empacotar
          pacote="$(find apps/seller-app/release -name app.asar | head -n 1)"
          test -n "$pacote" || { echo "::error::O electron-builder não gerou o app.asar do Corona Vendas."; exit 1; }
          node scripts/barreira/varrer-pacote.mjs "$pacote" packages/shared packages/ui packages/conexao-segura

  backend:
    name: backend
    needs: mudancas
    if: needs.mudancas.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          # Mesma versão do ADR-0001 (fixa, sem "21" flutuante).
          java-version: '21.0.13+9'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Os testes usam o Docker do runner (Testcontainers com PostgreSQL de verdade, ADR-0002).
      - run: ./mvnw -B verify
        working-directory: backend

  # Duas pontas (tarefa 5.12; ADR-0013, item 20): o motor do Corona Vendas em Node (SQLCipher de verdade) contra a API de
  # verdade (jar) e um PostgreSQL descartável, com o proxy de rede ruim, os cenários e o estresse curto (1 min).
  # A semente é o número do run: o log mostra "Duas pontas (...): semente=..." para repetir.
  sync-duas-pontas:
    name: sync-duas-pontas
    needs: mudancas
    if: needs.mudancas.outputs.sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # O motor roda em Node: o Electron não é baixado.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Duas pontas (cenários e estresse curto)
        env:
          CORONA_SYNC_SEMENTE: ${{ github.run_id }}
          CORONA_SYNC_DURACAO: PT1M
        run: npm run test:duas-pontas -w @corona/testes-sync
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: resultados-duas-pontas
          path: testes-sync/resultados

  migracoes:
    name: migracoes
    needs: mudancas
    # Só em PR (fora dele não há "base" para comparar) e quando o PR mexe em migração.
    if: github.event_name == 'pull_request' && needs.mudancas.outputs.migracoes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: bash scripts/verificar-migracoes.sh "${{ github.event.pull_request.base.sha }}"

  dependencias:
    name: dependencias
    needs: mudancas
    # Quando o PR mexe em package*.json, pom.xml ou no workflow; no mais, a rodada semanal da main confere (npm audit e OSV).
    if: needs.mudancas.outputs.dependencias == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reprova com vulnerabilidade alta ou crítica (CVSS 7.0 ou mais). As menores só aparecem no log.
      - run: npm audit --audit-level=high
      # OSV-Scanner cobre o package-lock.json e o pom.xml. Ele grava o resultado e quem
      # decide é o filtro de gravidade logo abaixo; se o scanner quebrar, não haverá arquivo e o job falha.
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --lockfile=backend/pom.xml
            --format=json
            --output-file=osv.json
      - name: Conferir gravidade (reprova com CVSS 7.0 ou mais)
        run: |
          test -s osv.json || { echo "::error::O OSV-Scanner não gerou resultado. Veja o passo anterior."; exit 1; }
          jq -r '.results[]?.packages[]? | .package.name as $p | .groups[]? | "\($p) \(.ids | join(",")) gravidade=\(.max_severity // "desconhecida")"' osv.json
          altas="$(jq '[.results[]?.packages[]?.groups[]? | select((.max_severity // "0") | tonumber? // 0 | . >= 7)] | length' osv.json)"
          if [ "$altas" -gt 0 ]; then
            echo "::error::Há $altas vulnerabilidade(s) alta(s) ou crítica(s) nas dependências. Atualize os pacotes listados acima."
            exit 1
          fi

  # PR que só mexe em documentos não roda o front: só confere a formatação (o mesmo prettier do job frontend).
  docs:
    name: docs
    needs: mudancas
    if: needs.mudancas.outputs.docs == 'true' && needs.mudancas.outputs.frontend != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check

  # O ÚNICO status para a regra de merge: roda sempre no fim (menos em rascunho) e só reprova se algum job rodou e falhou
  # ou foi cancelado, ou se o "mudancas" não teve sucesso (sem ele nada foi decidido). Job pulado por filtro de caminho não reprova: PR nunca fica sem status.
  ci:
    name: ci
    # !cancelled(): um run cancelado (push novo) não pode terminar verde; o run novo reporta no lugar dele.
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    needs: [mudancas, frontend, backend, sync-duas-pontas, migracoes, dependencias, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resultado dos jobs
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
          MUDANCAS: ${{ needs.mudancas.result }}
        run: |
          echo "Resultados: $RESULTADOS (mudancas: $MUDANCAS)"
          # Sem o "mudancas" bem-sucedido nada foi decidido nem rodado: nunca fica verde (pulado, cancelado ou falho).
          if [ "$MUDANCAS" != "success" ]; then
            echo "::error::O job mudancas não terminou com sucesso ($MUDANCAS): o CI não rodou de verdade."
            exit 1
          fi
          case " $RESULTADOS " in
            *" failure "*|*" cancelled "*) echo "::error::Algum job do CI falhou ou foi cancelado."; exit 1 ;;
          esac

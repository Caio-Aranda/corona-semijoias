name: E2E

# Testes de ponta a ponta (Playwright + Electron). Ficam FORA do CI de todo Pull Request porque sobem Docker,
# a API e o Electron (vários minutos). Rodam à mão (Actions > E2E > Run workflow) e toda madrugada de segunda.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: npm ci
      - run: test -d node_modules/electron/dist || node node_modules/electron/install.js
      # O Electron precisa de uma tela; o xvfb faz uma de mentira.
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
      - run: xvfb-run --auto-servernum npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: resultados-e2e
          path: testes-e2e/resultados

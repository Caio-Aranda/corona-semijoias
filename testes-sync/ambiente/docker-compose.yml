# Banco ISOLADO só para os testes de duas pontas (tarefa 5.12). Projeto, porta e nome próprios: nunca é o banco de
# desenvolvimento (5432) nem o do e2e (5499) nem a produção. Sem volume: tudo some quando o contêiner cai.
# Valores falsos, só de teste.
name: corona-sync
services:
  postgres:
    image: postgres:18.6
    command: [postgres, -c, max_prepared_transactions=0, -c, timezone=UTC]
    environment:
      POSTGRES_USER: sync_admin
      POSTGRES_PASSWORD: sync-admin-senha
      POSTGRES_DB: corona_sync
      DB_MIGRACAO_USER: sync_mig
      DB_MIGRACAO_PASSWORD: sync-mig-senha
      DB_APP_USER: sync_app
      DB_APP_PASSWORD: sync-app-senha
    ports:
      - '127.0.0.1:5498:5432'
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ../../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sync_admin -d corona_sync']
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

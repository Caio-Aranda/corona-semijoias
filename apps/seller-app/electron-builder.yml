# Pacote e instalador do Corona Vendas (ADR-0003, item 5, e ADR-0009). Só o que o electron-vite gerou entra, mais o
# módulo nativo do banco local (tarefa 5.2); nada além dele de node_modules. O CI roda "electron-builder --dir" (sem rede) e varre o app.asar atrás de marcadores proibidos.
# O instalador (NSIS) e o canal de atualização vêm de: npm run vendas:empacotar (que passa a publicação por argumento).
appId: br.com.coronasemijoias.vendas
productName: Corona Vendas
asar: true
# Usa o Electron que o npm já baixou: o empacotamento não baixa nada.
electronDist: ../../node_modules/electron/dist
electronVersion: 45.2.3
npmRebuild: false
nodeGypRebuild: false
# Pasta de instalação do instalador por usuário usa o nome do pacote; sem isto ficaria "@coronaseller-app".
extraMetadata:
  name: corona-vendas
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
  # Banco local cifrado (tarefa 5.2; ADR-0005): só o módulo nativo, só o binário do Windows x64, sem o código-fonte do
  # SQLite (deps/, src/) e sem os binários das outras plataformas.
  - node_modules/better-sqlite3-multiple-ciphers/lib/**
  - node_modules/better-sqlite3-multiple-ciphers/package.json
  - node_modules/better-sqlite3-multiple-ciphers/prebuilds/win32-x64.node
  - '!**/better-sqlite3-multiple-ciphers/{deps,src}/**'
  - '!**/better-sqlite3-multiple-ciphers/prebuilds/{darwin,linux}*'
  - '!**/better-sqlite3-multiple-ciphers/prebuilds/win32-arm64.node'
  - '!**/better-sqlite3-multiple-ciphers/binding.gyp'
# O binário nativo fica fora do app.asar (o Windows carrega .node de arquivo de verdade).
asarUnpack:
  - node_modules/better-sqlite3-multiple-ciphers/prebuilds/**
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
  # Ícone estilo C da proposta visual (gerado por scripts/gerar-icones.py); cada app tem o seu (§18).
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Corona Vendas
  runAfterFinish: true
  uninstallDisplayName: Corona Vendas
  deleteAppDataOnUninstall: false
  artifactName: Corona-Vendas-Setup-${version}.${ext}

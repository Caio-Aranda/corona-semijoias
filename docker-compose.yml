# Somente para DESENVOLVIMENTO. Não use em produção (a produção entra na Fase 9).
# As credenciais vêm do arquivo ".env" (copie o ".env.example").
name: corona-semijoias

services:
  postgres:
    image: postgres:19.0
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_prepared_transactions=0 # ADR-0002: transações preparadas segurariam o xmin do pull
      - -c
      - timezone=UTC # ADR-0002: datas sempre em UTC
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Preencha POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${DB_NAME:?Preencha DB_NAME no arquivo .env}
      DB_MIGRACAO_USER: ${DB_MIGRACAO_USER:?Preencha DB_MIGRACAO_USER no arquivo .env}
      DB_MIGRACAO_PASSWORD: ${DB_MIGRACAO_PASSWORD:?Preencha DB_MIGRACAO_PASSWORD no arquivo .env}
      DB_APP_USER: ${DB_APP_USER:?Preencha DB_APP_USER no arquivo .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Preencha DB_APP_PASSWORD no arquivo .env}
    ports:
      # Só este computador acessa o banco (especificação §5 e §11).
      - '127.0.0.1:${DB_PORT:?Preencha DB_PORT no arquivo .env}:5432'
    volumes:
      - corona_pg_dev:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  corona_pg_dev:

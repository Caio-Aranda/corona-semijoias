# Igual ao do Corona Vendas (apps/seller-app/electron-builder.yml) + asarUnpack do módulo nativo.
appId: br.com.coronasemijoias.spike
productName: Spike SQLCipher
asar: true
electronDist: ../../node_modules/electron/dist
electronVersion: 45.2.3
npmRebuild: false
nodeGypRebuild: false
directories:
  output: release
files:
  - app/**
  - package.json
  - node_modules/better-sqlite3-multiple-ciphers/lib/**
  - node_modules/better-sqlite3-multiple-ciphers/package.json
  - node_modules/better-sqlite3-multiple-ciphers/prebuilds/win32-x64.node
  - '!**/better-sqlite3-multiple-ciphers/{deps,src}/**'
  - '!**/better-sqlite3-multiple-ciphers/prebuilds/{darwin,linux}*'
  - '!**/better-sqlite3-multiple-ciphers/prebuilds/win32-arm64.node'
  - '!**/better-sqlite3-multiple-ciphers/binding.gyp'
asarUnpack:
  - node_modules/better-sqlite3-multiple-ciphers/prebuilds/**
win:
  signAndEditExecutable: false
  target: dir

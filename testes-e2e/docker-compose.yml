# Banco ISOLADO só para os testes de ponta a ponta. Projeto, porta e nome próprios: nunca é o banco de
# desenvolvimento (5432) nem a produção. Sem volume: tudo some quando o contêiner cai. Valores falsos, só de teste.
name: corona-e2e
services:
  postgres:
    image: postgres:18.6
    command: [postgres, -c, max_prepared_transactions=0, -c, timezone=UTC]
    environment:
      POSTGRES_USER: e2e_admin
      POSTGRES_PASSWORD: e2e-admin-senha
      POSTGRES_DB: corona_e2e
      DB_MIGRACAO_USER: e2e_mig
      DB_MIGRACAO_PASSWORD: e2e-mig-senha
      DB_APP_USER: e2e_app
      DB_APP_PASSWORD: e2e-app-senha
    ports:
      - '127.0.0.1:5499:5432'
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U e2e_admin -d corona_e2e']
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

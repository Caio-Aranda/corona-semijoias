# Perfil de produção (Fase 9 mínima, ADR-0009). Os segredos vêm só de variáveis de ambiente do servidor
# (deploy/.env). Nada aqui é segredo.

# Swagger e OpenAPI desligados (o padrão já é desligado; repetido aqui para ninguém ligar por engano).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Erros sem detalhe técnico: nada de mensagem de exceção, pilha de chamadas nem erro de validação cru.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=never
server.error.whitelabel.enabled=false
server.server-header=

# Desligamento ordenado: termina o que está em andamento antes de parar.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# A API só escuta dentro da rede interna do Compose; quem fala com a internet é o proxy (HTTPS).
server.port=8080

# Saúde sem nenhum detalhe (repetido do padrão).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Log: sem valores de SQL (já desligado no padrão) e sem ruído.
logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=OFF

# O vendedor de demonstração nunca é criado em produção.
corona.vendedor-demo.nome=
corona.vendedor-demo.login=
corona.vendedor-demo.senha=

spring.application.name=corona-api

# --- Configuração local (.env da raiz do projeto, o mesmo do Docker Compose) ---
# Vale rodando de "backend/" (primeiro caminho) ou da raiz (segundo). Se o arquivo não
# existir, nada acontece aqui; a mensagem em português de "falta configurar" vem do
# AnalisadorVariavelAusente. Variáveis de ambiente reais têm prioridade sobre o arquivo.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# --- Banco de dados ---
# A aplicação usa o usuário da aplicação (sem superusuário, sem DELETE).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_APP_USER}
spring.datasource.password=${DB_APP_PASSWORD}

# Migrações com o usuário das migrações, dono do schema "corona" (que já existe).
spring.flyway.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.flyway.user=${DB_MIGRACAO_USER}
spring.flyway.password=${DB_MIGRACAO_PASSWORD}
spring.flyway.schemas=corona
spring.flyway.default-schema=corona
spring.flyway.create-schemas=false
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# UPDATE sem RETURNING, para o conflito de versão aparecer como conflito (ver a classe).
spring.jpa.properties.hibernate.dialect=br.com.coronasemijoias.api.comum.persistencia.DialetoPostgreSqlCorona

# Log de SQL nunca mostra os valores (parâmetros), em nenhum perfil: o hash da senha e outros dados
# pessoais não podem ir para o log. Para ver o SQL ao depurar, ligue só o comando, nunca os valores.
spring.jpa.show-sql=false
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=OFF

# --- UTC em tudo (ADR-0002) ---
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# --- Idioma ---
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# --- Actuator: só a saúde, sem detalhes ---
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never

# --- OpenAPI e Swagger: desligados; o perfil "dev" liga (application-dev.properties) ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Segurança (ADR-0004): token de acesso, senha e perfis por grupo de rotas ---
# As chaves vêm do .env (veja o .env.example). Vazias, a API não sobe e explica o que fazer.
corona.seguranca.jwt.emissor=corona-api
corona.seguranca.jwt.duracao=PT15M
corona.seguranca.jwt.chave-atual.id=${JWT_CHAVE_ATUAL_ID:}
corona.seguranca.jwt.chave-atual.valor=${JWT_CHAVE_ATUAL:}
corona.seguranca.jwt.chave-anterior.id=${JWT_CHAVE_ANTERIOR_ID:}
corona.seguranca.jwt.chave-anterior.valor=${JWT_CHAVE_ANTERIOR:}
corona.seguranca.bcrypt.custo=12
# Quanto tempo vale a senha temporária, da criação do usuário ou de cada redefinição (ADR-0004, item 6).
corona.seguranca.senha-temporaria.validade=P7D
# Perfis aceitos em cada grupo de rotas (/api/dona/** e /api/vendedor/**). Perfil novo num grupo:
# acrescente aqui, separado por vírgula (por exemplo ADMIN,GERENTE).
corona.seguranca.grupos.dona=ADMIN
corona.seguranca.grupos.vendedor=VENDEDOR

# --- Primeiro administrador: só usado enquanto o banco não tem nenhum ADMIN ---
corona.admin-inicial.nome=${ADMIN_NOME:}
corona.admin-inicial.login=${ADMIN_LOGIN:}
corona.admin-inicial.senha=${ADMIN_SENHA:}
